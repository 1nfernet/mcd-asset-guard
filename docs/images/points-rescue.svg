<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="28" y="40" font-size="19" font-weight="600" fill="#1f2328">临期积分救回：同一个账户，两种结局</text>
  <text x="28" y="63" font-size="12.5" fill="#59636e">真实账户数据（2026-10-14 实测）：可用 842.9 分，本月将过期 43.8 分</text>

  <rect x="28" y="86" width="336" height="182" rx="10" fill="#fdf2f2" stroke="#e0a0a0" stroke-width="1"/>
  <text x="48" y="114" font-size="14" font-weight="600" fill="#a32d2d">没有看护</text>
  <text x="48" y="144" font-size="13" fill="#5f5e5a">本月到期</text>
  <text x="200" y="144" font-size="13" fill="#a32d2d">43.8 分</text>
  <text x="48" y="172" font-size="13" fill="#5f5e5a">10-31 之后</text>
  <text x="200" y="172" font-size="13" fill="#a32d2d">直接清零</text>
  <text x="48" y="200" font-size="13" fill="#5f5e5a">实际损失</text>
  <text x="200" y="200" font-size="15" font-weight="600" fill="#a32d2d">43.8 积分</text>
  <text x="48" y="234" font-size="12.5" fill="#7a7a75">会员知道积分会过期，但没人告诉他「还剩几天」</text>

  <rect x="396" y="86" width="336" height="182" rx="10" fill="#eef7f1" stroke="#7fb79a" stroke-width="1"/>
  <text x="416" y="114" font-size="14" font-weight="600" fill="#0f6e56">有麦麦资产管家</text>
  <text x="416" y="144" font-size="13" fill="#5f5e5a">分级提醒</text>
  <text x="568" y="144" font-size="13" fill="#0f6e56">3 天前触发</text>
  <text x="416" y="172" font-size="13" fill="#5f5e5a">推荐组合</text>
  <text x="568" y="172" font-size="13" fill="#0f6e56">酸黄瓜吧唧礼盒 x1</text>
  <text x="416" y="200" font-size="13" fill="#5f5e5a">兑换后余额</text>
  <text x="568" y="200" font-size="13" fill="#0f6e56">42.9 积分</text>
  <text x="416" y="228" font-size="13" fill="#5f5e5a">救回</text>
  <text x="568" y="228" font-size="15" font-weight="600" fill="#0f6e56">43.8 / 43.8 全部救回</text>

  <line x1="380" y1="86" x2="380" y2="268" stroke="#d8d8d2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="28" y="288" font-size="11.5" fill="#8a8a85">组合由本地有界背包 DP 计算（非大模型口算）；命令：python -m src.main personal mall --plan</text>
</svg>
